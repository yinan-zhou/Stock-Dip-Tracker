<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF Dip Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #f0f0f5;
    --muted: #6b6b7e;
    --accent: #7c6af7;
    --accent2: #a89cf5;
    --green: #2ecc87;
    --green-bg: rgba(46,204,135,0.1);
    --amber: #f5a623;
    --amber-bg: rgba(245,166,35,0.1);
    --red: #f54242;
    --red-bg: rgba(245,66,66,0.1);
    --blue: #4fa3f7;
    --blue-bg: rgba(79,163,247,0.1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    padding: 2rem 1rem;
  }

  .container { max-width: 960px; margin: 0 auto; }

  header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 2.5rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .logo {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--accent);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  h1 {
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
  }

  .last-updated {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 6px;
    padding: 6px 12px;
    white-space: nowrap;
  }

  .live-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--green);
    background: var(--green-bg);
    border: 0.5px solid rgba(46,204,135,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    margin-left: 8px;
  }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    animation: blink 1.5s ease-in-out infinite;
  }

  .stale-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--amber);
    background: var(--amber-bg);
    border: 0.5px solid rgba(245,166,35,0.3);
    border-radius: 20px;
    padding: 3px 10px;
    margin-left: 8px;
  }

  .fetching-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 20px;
    padding: 3px 10px;
    margin-left: 8px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  /* Ticker tabs */
  .ticker-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .tab {
    padding: 8px 20px;
    border-radius: 8px;
    border: 0.5px solid var(--border2);
    background: var(--surface);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.05em;
  }

  .tab:hover { border-color: var(--accent); color: var(--accent2); }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ATH row */
  .ath-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 1.5rem;
  }

  .ath-card {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: 12px;
    padding: 1rem 1.2rem;
  }

  .ath-card.highlight { border-color: var(--accent); background: rgba(124,106,247,0.08); }

  .ath-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
  }

  .ath-value {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .ath-value.green { color: var(--green); }
  .ath-value.amber { color: var(--amber); }
  .ath-value.purple { color: var(--accent2); }
  .ath-value.blue { color: var(--blue); }

  .ath-sub {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 3px;
  }

  /* Input row */
  .input-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 1.5rem;
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: 12px;
    padding: 1rem 1.2rem;
  }

  .input-group label {
    display: block;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 6px;
  }

  .input-group input,
  .input-group select {
    width: 100%;
    background: var(--surface2);
    border: 0.5px solid var(--border2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.15s;
  }

  .input-group input:focus { border-color: var(--accent); }
  .input-group select:focus { border-color: var(--accent); }

  .alert-row {
    display: grid;
    grid-template-columns: 1.4fr 1fr auto;
    gap: 10px;
    margin: -0.8rem 0 1.5rem;
    background: rgba(46,204,135,0.04);
    border: 0.5px solid rgba(46,204,135,0.22);
    border-radius: 12px;
    padding: 1rem 1.2rem;
  }

  .alert-status {
    align-self: end;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    line-height: 1.35;
  }

  .update-btn {
    align-self: flex-end;
    padding: 9px 20px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }

  .update-btn:hover { opacity: 0.85; }

  /* Dip table */
  .section-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 0.75rem;
  }

  .dip-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .dip-row {
    background: var(--surface);
    border: 0.5px solid var(--border);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: grid;
    grid-template-columns: 80px 1fr 120px 120px 120px 100px;
    align-items: center;
    gap: 12px;
    transition: border-color 0.15s;
  }

  .dip-row:hover { border-color: var(--border2); }
  .dip-row.triggered { border-color: rgba(46,204,135,0.25); background: rgba(46,204,135,0.04); }
  .dip-row.current-zone { border-color: rgba(245,166,35,0.4); background: rgba(245,166,35,0.06); animation: pulse-amber 2s ease-in-out infinite; }

  @keyframes pulse-amber {
    0%, 100% { border-color: rgba(245,166,35,0.4); }
    50% { border-color: rgba(245,166,35,0.8); }
  }

  .dip-pct {
    font-family: 'DM Mono', monospace;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text);
  }

  .dip-price-block {}

  .dip-price {
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .dip-price-label {
    font-size: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    margin-top: 2px;
  }

  .col-label {
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    text-align: center;
  }

  .count-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    margin: 0 auto;
  }

  .badge-green { background: var(--green-bg); color: var(--green); }
  .badge-amber { background: var(--amber-bg); color: var(--amber); }
  .badge-gray { background: rgba(107,107,126,0.15); color: var(--muted); }
  .badge-blue { background: var(--blue-bg); color: var(--blue); }

  .status-pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-align: center;
    white-space: nowrap;
  }

  .pill-done { background: var(--green-bg); color: var(--green); }
  .pill-near { background: var(--amber-bg); color: var(--amber); }
  .pill-waiting { background: rgba(107,107,126,0.15); color: var(--muted); }
  .pill-zone { background: var(--amber-bg); color: var(--amber); }

  /* Table header row */
  .dip-header {
    display: grid;
    grid-template-columns: 80px 1fr 120px 120px 120px 100px;
    gap: 12px;
    padding: 0 1.25rem;
    margin-bottom: 4px;
  }

  /* Progress bar */
  .progress-section {
    background: var(--surface);
    border: 0.5px solid var(--border2);
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .progress-title {
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    margin-bottom: 1rem;
  }

  .year-progress {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }

  .progress-label { font-size: 11px; font-family: 'DM Mono', monospace; color: var(--muted); min-width: 90px; }

  .progress-bar {
    flex: 1;
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }

  .fill-purple { background: var(--accent); }
  .fill-green { background: var(--green); }
  .fill-amber { background: var(--amber); }

  .progress-val { font-size: 12px; font-family: 'DM Mono', monospace; color: var(--text); min-width: 40px; text-align: right; }

  /* Bottom note */
  .note {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
    line-height: 1.7;
    border-top: 0.5px solid var(--border);
    padding-top: 1rem;
    margin-top: 0.5rem;
  }

  /* Current dip callout */
  .current-callout {
    background: linear-gradient(135deg, rgba(124,106,247,0.12), rgba(79,163,247,0.08));
    border: 0.5px solid rgba(124,106,247,0.3);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .callout-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
    flex-shrink: 0;
    animation: blink 1.5s ease-in-out infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .callout-text { font-size: 13px; color: var(--accent2); font-family: 'DM Mono', monospace; }
  .callout-text strong { color: var(--text); }

  @media (max-width: 700px) {
    .dip-row, .dip-header {
      grid-template-columns: 60px 1fr 90px 90px;
    }
    .dip-row > *:nth-child(4),
    .dip-header > *:nth-child(4) { display: none; }
    .dip-row > *:nth-child(5),
    .dip-header > *:nth-child(5) { display: none; }
    .input-row { grid-template-columns: 1fr 1fr; }
    .alert-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <div>
      <div class="logo">▸ ETF Dip Tracker</div>
      <h1>Dip Entry Dashboard</h1>
      <div class="subtitle">QQQ · SPY — 2026 pullback monitor</div>
    </div>
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px;">
      <div class="last-updated" id="lastUpdated">Updated: —</div>
      <span id="liveBadge" class="fetching-badge">⟳ fetching...</span>
      <button class="update-btn" onclick="fetchAllPrices()" style="padding:6px 14px;font-size:12px;">↻ Refresh</button>
    </div>
  </header>

  <!-- Ticker Tabs -->
  <div class="ticker-tabs">
    <button class="tab active" onclick="switchTicker('QQQ')">QQQ</button>
    <button class="tab" onclick="switchTicker('SPY')">SPY</button>
  </div>

  <!-- ATH Summary Cards -->
  <div class="ath-row" id="athRow"></div>

  <!-- Inputs -->
  <div class="input-row">
    <div class="input-group">
      <label>Current Price ($)</label>
      <input type="number" id="inputPrice" step="0.01" placeholder="e.g. 726.04">
    </div>
    <div class="input-group">
      <label>ATH ($) — override</label>
      <input type="number" id="inputATH" step="0.01" placeholder="e.g. 748.65">
    </div>
    <div>
      <button class="update-btn" onclick="updateData()">↻ Update</button>
    </div>
  </div>

  <div class="alert-row">
    <div class="input-group">
      <label>Email alert to</label>
      <input type="email" id="alertEmail" placeholder="you@example.com">
    </div>
    <div class="input-group">
      <label>Trigger when dip reaches</label>
      <select id="alertThreshold">
        <option value="5">5% dip</option>
        <option value="8">8% dip</option>
        <option value="10">10% dip</option>
        <option value="15">15% dip</option>
        <option value="20">20% dip</option>
      </select>
    </div>
    <div class="alert-status" id="alertStatus">Email alert off</div>
  </div>

  <!-- Current dip callout -->
  <div class="current-callout" id="currentCallout"></div>

  <!-- Dip table -->
  <div class="section-label">Dip levels — occurred vs remaining (2026)</div>

  <div class="dip-header">
    <span class="col-label">Level</span>
    <span class="col-label" style="text-align:left">Target price</span>
    <span class="col-label">Occurred</span>
    <span class="col-label">Remaining</span>
    <span class="col-label">Expected/yr</span>
    <span class="col-label">Status</span>
  </div>

  <div class="dip-grid" id="dipGrid"></div>

  <!-- Progress -->
  <div class="progress-section">
    <div class="progress-title">// year progress & dip budget</div>
    <div class="year-progress">
      <span class="progress-label">Year elapsed</span>
      <div class="progress-bar"><div class="progress-fill fill-purple" id="yearBar" style="width:0%"></div></div>
      <span class="progress-val" id="yearPct">—</span>
    </div>
    <div class="year-progress">
      <span class="progress-label">5% dips used</span>
      <div class="progress-bar"><div class="progress-fill fill-green" id="dip5Bar" style="width:0%"></div></div>
      <span class="progress-val" id="dip5Pct">—</span>
    </div>
    <div class="year-progress">
      <span class="progress-label">10% dips used</span>
      <div class="progress-bar"><div class="progress-fill fill-amber" id="dip10Bar" style="width:0%"></div></div>
      <span class="progress-val" id="dip10Pct">—</span>
    </div>
  </div>

  <div class="note" id="noteBlock"></div>

</div>

<script>
const TICKERS = {
  QQQ: {
    ath: 748.65,
    current: 726.04,
    crashLow: 505.58,
    crashDepth: 23,
    recoveryPct: 42.8,
    dipOccurred: { 5: 1, 8: 1, 10: 1, 15: 1, 20: 1 },
    expectedFull: { 5: 4, 8: 2, 10: 1.5, 15: 0.5, 20: 0.25 },
    expectedRemaining: { 5: 2.5, 8: 1, 10: 0.5, 15: 0.2, 20: 0.05 }
  },
  SPY: {
    ath: 760.40,
    current: 749.82,
    crashLow: 575.60,
    crashDepth: 19,
    recoveryPct: 30.2,
    dipOccurred: { 5: 1, 8: 1, 10: 1, 15: 0, 20: 0 },
    expectedFull: { 5: 3, 8: 1.5, 10: 1, 15: 0.4, 20: 0.2 },
    expectedRemaining: { 5: 2, 8: 0.8, 10: 0.4, 15: 0.15, 20: 0.04 }
  }
};

let activeTicker = 'QQQ';
let lastFetchTime = null;
let priceIsLive = false;





// Finnhub — direct CORS-supported API, free tier, real-time US quotes
const FINNHUB_KEY = 'd86bqfhr01qgiu44nqvgd86bqfhr01qgiu44nr00';

// Add your EmailJS values here for automatic sends from a static site.
// Until these are filled in, the alert opens a prefilled email draft instead.
const EMAILJS_SERVICE_ID = '';
const EMAILJS_TEMPLATE_ID = '';
const EMAILJS_PUBLIC_KEY = '';
const ALERT_STORAGE_KEY = 'stockDipEmailAlert';
const ALERT_SENT_KEY = 'stockDipEmailAlertSent';

async function fetchTickerLiveData(symbol) {
  const url = `https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${FINNHUB_KEY}`;
  const resp = await fetch(url, { signal: AbortSignal.timeout(10000) });
  if (!resp.ok) throw new Error('finnhub http ' + resp.status);
  const data = await resp.json();
  const price = data.c > 0 ? data.c : data.pc;
  if (!price || price <= 0) throw new Error('finnhub bad price');
  const ath = Math.max(price, TICKERS[symbol].ath);
  return { price, ath, athIsLive: false };
}

async function fetchAllPrices() {
  const badge = document.getElementById('liveBadge');
  badge.className = 'fetching-badge';
  badge.textContent = '⟳ fetching...';
  const results = await Promise.allSettled([
    fetchTickerLiveData('QQQ'),
    fetchTickerLiveData('SPY')
  ]);
  const qqq = results[0].status === 'fulfilled' ? results[0].value : null;
  const spy = results[1].status === 'fulfilled' ? results[1].value : null;

  if (qqq?.price > 0) {
    TICKERS.QQQ.current = qqq.price;
    TICKERS.QQQ.ath = qqq.ath;
  }
  if (spy?.price > 0) {
    TICKERS.SPY.current = spy.price;
    TICKERS.SPY.ath = spy.ath;
  }

  if (qqq || spy) {
    lastFetchTime = new Date();
    priceIsLive = true;
    badge.className = 'live-badge';
    badge.innerHTML = `<span class="live-dot"></span>${qqq?.athIsLive || spy?.athIsLive ? 'live price + ATH' : 'live price'}`;
    document.getElementById('inputPrice').value = TICKERS[activeTicker].current.toFixed(2);
    document.getElementById('inputATH').value = TICKERS[activeTicker].ath.toFixed(2);
    render();
    checkDipEmailAlert('QQQ');
    checkDipEmailAlert('SPY');
  } else {
    priceIsLive = false;
    badge.className = 'stale-badge';
    badge.textContent = '⚠ offline — enter price manually';
    render();
  }
}

function switchTicker(t) {
  activeTicker = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.textContent === t));
  const d = TICKERS[t];
  document.getElementById('inputPrice').value = d.current.toFixed(2);
  document.getElementById('inputATH').value = d.ath.toFixed(2);
  render();
}

function updateData() {
  const price = parseFloat(document.getElementById('inputPrice').value);
  const ath = parseFloat(document.getElementById('inputATH').value);
  if (!isNaN(price) && price > 0) TICKERS[activeTicker].current = price;
  if (!isNaN(ath) && ath > 0) TICKERS[activeTicker].ath = ath;
  priceIsLive = false;
  document.getElementById('liveBadge').className = 'stale-badge';
  document.getElementById('liveBadge').textContent = '✎ manual';
  render();
  checkDipEmailAlert(activeTicker);
}

function fmt(n) { return '$' + n.toFixed(2); }
function fmtPct(n) { return (n >= 0 ? '+' : '') + n.toFixed(1) + '%'; }

function loadAlertSettings() {
  try {
    return JSON.parse(localStorage.getItem(ALERT_STORAGE_KEY)) || { email: '', threshold: 5 };
  } catch(e) {
    return { email: '', threshold: 5 };
  }
}

function saveAlertSettings() {
  const settings = {
    email: document.getElementById('alertEmail').value.trim(),
    threshold: parseFloat(document.getElementById('alertThreshold').value)
  };
  localStorage.setItem(ALERT_STORAGE_KEY, JSON.stringify(settings));
  updateAlertStatus();
}

function getSentAlerts() {
  try {
    return JSON.parse(localStorage.getItem(ALERT_SENT_KEY)) || {};
  } catch(e) {
    return {};
  }
}

function markAlertSent(symbol, level) {
  const sent = getSentAlerts();
  sent[`${symbol}-${level}`] = new Date().toISOString();
  localStorage.setItem(ALERT_SENT_KEY, JSON.stringify(sent));
}

function updateAlertStatus(message) {
  const settings = loadAlertSettings();
  const status = document.getElementById('alertStatus');
  if (message) {
    status.textContent = message;
  } else if (settings.email) {
    status.textContent = `Watching ${settings.threshold}%+ dips`;
  } else {
    status.textContent = 'Email alert off';
  }
}

async function sendDipAlertEmail({ symbol, level, dip, price, ath, email }) {
  const subject = `${symbol} reached a ${level}% dip`;
  const body = [
    `${symbol} has reached the ${level}% dip trigger.`,
    '',
    `Current price: ${fmt(price)}`,
    `Live ATH: ${fmt(ath)}`,
    `Dip from ATH: ${dip.toFixed(1)}%`,
    `Time: ${new Date().toLocaleString('en-US')}`
  ].join('\n');

  if (EMAILJS_SERVICE_ID && EMAILJS_TEMPLATE_ID && EMAILJS_PUBLIC_KEY) {
    const resp = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        service_id: EMAILJS_SERVICE_ID,
        template_id: EMAILJS_TEMPLATE_ID,
        user_id: EMAILJS_PUBLIC_KEY,
        template_params: {
          to_email: email,
          subject,
          ticker: symbol,
          dip_level: level,
          dip_percent: dip.toFixed(1),
          current_price: fmt(price),
          ath_price: fmt(ath),
          message: body
        }
      })
    });
    if (!resp.ok) throw new Error('emailjs http ' + resp.status);
    return 'Email sent';
  }

  window.location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  return 'Email draft opened';
}

async function checkDipEmailAlert(symbol) {
  const settings = loadAlertSettings();
  if (!settings.email) return;

  const d = TICKERS[symbol];
  const dip = Math.abs(((d.current - d.ath) / d.ath) * 100);
  const levels = [5, 8, 10, 15, 20].filter(level => level >= settings.threshold && dip >= level);
  if (!levels.length) return;

  const sentAlerts = getSentAlerts();
  for (const reachedLevel of levels) {
    const alertKey = `${symbol}-${reachedLevel}`;
    if (sentAlerts[alertKey]) continue;
    try {
      const result = await sendDipAlertEmail({
        symbol,
        level: reachedLevel,
        dip,
        price: d.current,
        ath: d.ath,
        email: settings.email
      });
      markAlertSent(symbol, reachedLevel);
      updateAlertStatus(`${result}: ${symbol} −${reachedLevel}%`);
    } catch(e) {
      updateAlertStatus(`Email failed: ${symbol} −${reachedLevel}%`);
    }
  }
}


function render() {
  const d = TICKERS[activeTicker];
  const ath = d.ath;
  const cur = d.current;
  const currentDip = ((cur - ath) / ath) * 100; // negative

  // Update timestamp
  const timeStr = lastFetchTime
    ? lastFetchTime.toLocaleString('en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})
    : new Date().toLocaleString('en-US', {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('lastUpdated').textContent = 'Updated: ' + timeStr;

  // ATH cards
  const athRow = document.getElementById('athRow');
  athRow.innerHTML = `
    <div class="ath-card highlight">
      <div class="ath-label">All-Time High</div>
      <div class="ath-value purple">${fmt(ath)}</div>
      <div class="ath-sub">${activeTicker} ATH</div>
    </div>
    <div class="ath-card">
      <div class="ath-label">Current Price</div>
      <div class="ath-value ${Math.abs(currentDip) < 3 ? 'green' : Math.abs(currentDip) < 8 ? 'amber' : 'red'}">${fmt(cur)}</div>
      <div class="ath-sub">${fmtPct(currentDip)} from ATH</div>
    </div>
    <div class="ath-card">
      <div class="ath-label">2026 Crash Low</div>
      <div class="ath-value red">${fmt(d.crashLow)}</div>
      <div class="ath-sub">−${d.crashDepth}% drawdown</div>
    </div>
    <div class="ath-card">
      <div class="ath-label">Recovery from Low</div>
      <div class="ath-value green">+${d.recoveryPct.toFixed(1)}%</div>
      <div class="ath-sub">${fmt(d.crashLow)} → ${fmt(ath)}</div>
    </div>
  `;

  // Callout
  const callout = document.getElementById('currentCallout');
  const absD = Math.abs(currentDip);
  let zone = '';
  if (absD < 3) zone = `Market is <strong>${Math.abs(currentDip).toFixed(1)}%</strong> off ATH — near ATH, no dip entry yet`;
  else if (absD < 5) zone = `Approaching <strong>5% dip level</strong> — currently <strong>${absD.toFixed(1)}%</strong> off ATH`;
  else if (absD < 8) zone = `Inside <strong>5% dip zone</strong> — ${absD.toFixed(1)}% off ATH. Consider first tranche entry`;
  else if (absD < 10) zone = `Inside <strong>8% dip zone</strong> — ${absD.toFixed(1)}% off ATH. Scale-in opportunity`;
  else if (absD < 15) zone = `Inside <strong>10% correction zone</strong> — ${absD.toFixed(1)}% off ATH. Strong scale-in`;
  else zone = `Deep pullback: <strong>${absD.toFixed(1)}%</strong> off ATH — major entry opportunity`;
  callout.innerHTML = `<div class="callout-dot"></div><div class="callout-text">${zone}</div>`;

  // Dip levels
  const levels = [5, 8, 10, 15, 20];
  const colors = { 5: 'green', 8: 'green', 10: 'amber', 15: 'amber', 20: 'red' };
  const grid = document.getElementById('dipGrid');
  grid.innerHTML = '';

  levels.forEach(pct => {
    const targetPrice = ath * (1 - pct / 100);
    const occurred = d.dipOccurred[pct] || 0;
    const remaining = d.expectedRemaining[pct];
    const fullYear = d.expectedFull[pct];
    const alreadyHere = Math.abs(currentDip) >= pct;
    const nearZone = !alreadyHere && Math.abs(currentDip) >= pct - 1.5;

    let statusClass = 'pill-waiting';
    let statusText = 'Waiting';
    let rowClass = '';

    if (alreadyHere) {
      statusClass = 'pill-done'; statusText = 'Reached'; rowClass = 'triggered';
    } else if (nearZone) {
      statusClass = 'pill-near'; statusText = 'Near'; rowClass = 'current-zone';
    }

    const remDisplay = remaining >= 1 ? remaining.toFixed(1) : '~' + remaining.toFixed(2);
    const remBadgeClass = remaining >= 1.5 ? 'badge-green' : remaining >= 0.5 ? 'badge-amber' : 'badge-gray';
    const occBadgeClass = occurred >= 1 ? 'badge-green' : 'badge-gray';

    grid.innerHTML += `
      <div class="dip-row ${rowClass}">
        <div class="dip-pct" style="color:var(--${colors[pct]})">−${pct}%</div>
        <div class="dip-price-block">
          <div class="dip-price">${fmt(targetPrice)}</div>
          <div class="dip-price-label">from ATH ${fmt(ath)}</div>
        </div>
        <div style="text-align:center"><div class="count-badge ${occBadgeClass}">${occurred}</div></div>
        <div style="text-align:center"><div class="count-badge ${remBadgeClass}">${remaining < 0.1 ? '<0.1' : remaining.toFixed(1)}</div></div>
        <div style="text-align:center"><div class="count-badge badge-blue">${fullYear.toFixed(1)}</div></div>
        <div><span class="status-pill ${statusClass}">${statusText}</span></div>
      </div>
    `;
  });

  // Progress bars
  const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
  const yearPct = Math.round((dayOfYear / 365) * 100);
  document.getElementById('yearBar').style.width = yearPct + '%';
  document.getElementById('yearPct').textContent = yearPct + '%';

  const exp5 = d.expectedFull[5];
  const occ5 = d.dipOccurred[5];
  const d5Pct = Math.min(100, Math.round((occ5 / exp5) * 100));
  document.getElementById('dip5Bar').style.width = d5Pct + '%';
  document.getElementById('dip5Pct').textContent = occ5 + '/' + exp5.toFixed(0);

  const exp10 = d.expectedFull[10];
  const occ10 = d.dipOccurred[10];
  const d10Pct = Math.min(100, Math.round((occ10 / exp10) * 100));
  document.getElementById('dip10Bar').style.width = d10Pct + '%';
  document.getElementById('dip10Pct').textContent = occ10 + '/' + exp10.toFixed(0);

  // Note
  document.getElementById('noteBlock').innerHTML = `
    // Data reflects 2026 post-tariff-crash environment. "Occurred" = dips already hit this year (the early-2026 selloff counts as the big one).
    "Remaining" = statistically expected additional occurrences rest of year, adjusted for crash already used up.
    "Expected/yr" = full-year historical average for ${activeTicker}. Not financial advice.
  `;
}

// Init — render with fallback values first, then fetch live
const alertSettings = loadAlertSettings();
if (!alertSettings.email) alertSettings.email = 'lena.zhouyinan@gmail.com';
document.getElementById('inputPrice').value = TICKERS[activeTicker].current;
document.getElementById('inputATH').value = TICKERS[activeTicker].ath;
document.getElementById('alertEmail').value = alertSettings.email;
document.getElementById('alertThreshold').value = String(alertSettings.threshold || 5);
document.getElementById('alertEmail').addEventListener('change', saveAlertSettings);
document.getElementById('alertThreshold').addEventListener('change', saveAlertSettings);
updateAlertStatus();
render();
fetchAllPrices();
</script>
